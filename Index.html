<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --absent: #3a3a3c;
            --present: #b59f3b;
            --correct: #538d4e;
            --border: #3a3a3c;
            --key-bg: #818384;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 10px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            width: 100%;
        }
        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            padding: 10px;
            box-sizing: border-box;
            aspect-ratio: 5 / 6;
            max-height: 38vh;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }
        .tile.filled { border-color: #565758; }
        .tile.absent { background-color: var(--absent); border-color: var(--absent); color: white; }
        .tile.present { background-color: var(--present); border-color: var(--present); color: white; }
        .tile.correct { background-color: var(--correct); border-color: var(--correct); color: white; }

        .keyboard {
            width: 100%;
            max-width: 500px;
            padding: 10px 5px 20px 5px;
            box-sizing: border-box;
        }
        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }
        .key {
            background-color: var(--key-bg);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            height: 50px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-transform: uppercase;
        }
        .key.wide { flex: 1.5; font-size: 12px; }
        #message {
            position: fixed;
            top: 70px;
            background: rgba(0,0,0,0.85);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <header>WORDLE RU</header>
    <div id="message">Сообщение</div>
    <div class="board" id="board"></div>
    <div class="keyboard" id="keyboard"></div>

    <script>
        const WORDS = ["КНИГА", "ПИЛОТ", "АТЛАС", "ОКЕАН", "ДЕРЕВО", "ШКОЛА", "УСПЕХ"];
        const secret = WORDS[Math.floor(Math.random() * WORDS.length)];
        let currentRow = 0, currentTile = 0;
        const boardState = Array(6).fill("").map(() => Array(5).fill(""));
        const keysState = {};

        const boardEl = document.getElementById('board');
        for (let r = 0; r < 6; r++) {
            const rowEl = document.createElement('div');
            rowEl.className = 'row';
            for (let c = 0; c < 5; c++) {
                const tileEl = document.createElement('div');
                tileEl.className = 'tile';
                tileEl.id = `tile-${r}-${c}`;
                rowEl.appendChild(tileEl);
            }
            boardEl.appendChild(rowEl);
        }

        const keys = [
            ["Й","Ц","У","К","Е","Н","Г","Ш","Щ","З","Х","Ъ"],
            ["Ф","Ы","В","А","П","Р","О","Л","Д","Ж","Э"],
            ["ENTER","Я","Ч","С","М","И","Т","Ь","Б","Ю","⌫"]
        ];
        const keyboardEl = document.getElementById('keyboard');
        keys.forEach(row => {
            const rowEl = document.createElement('div');
            rowEl.className = 'key-row';
            row.forEach(key => {
                const btn = document.createElement('button');
                btn.className = key.length > 1 ? 'key wide' : 'key';
                btn.textContent = key;
                btn.onclick = () => handleKey(key);
                rowEl.appendChild(btn);
                if (key.length === 1) keysState[key] = btn;
            });
            keyboardEl.appendChild(rowEl);
        });

        function handleKey(key) {
            if (key === '⌫') {
                if (currentTile > 0) {
                    currentTile--;
                    boardState[currentRow][currentTile] = "";
                    updateTile(currentRow, currentTile, "");
                }
            } else if (key === 'ENTER') {
                if (currentTile === 5) checkRow();
            } else {
                if (currentTile < 5) {
                    boardState[currentRow][currentTile] = key;
                    updateTile(currentRow, currentTile, key);
                    currentTile++;
                }
            }
        }

        function updateTile(r, c, letter) {
            const tile = document.getElementById(`tile-${r}-${c}`);
            tile.textContent = letter;
            tile.className = letter ? 'tile filled' : 'tile';
        }

        function showMsg(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 1500);
        }

        function checkRow() {
            const guess = boardState[currentRow].join("");
            if (guess.length < 5) return;

            const secretChars = secret.split("");
            const guessChars = guess.split("");
            const statuses = Array(5).fill("absent");

            for (let i = 0; i < 5; i++) {
                if (guessChars[i] === secretChars[i]) {
                    statuses[i] = "correct";
                    secretChars[i] = null;
                    guessChars[i] = null;
                }
            }
            for (let i = 0; i < 5; i++) {
                if (guessChars[i] !== null) {
                    const idx = secretChars.indexOf(guessChars[i]);
                    if (idx !== -1) {
                        statuses[i] = "present";
                        secretChars[idx] = null;
                    }
                }
            }

            for (let i = 0; i < 5; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                tile.classList.add(statuses[i]);
                const btn = keysState[guess[i]];
                if (btn) {
                    if (statuses[i] === 'correct') btn.style.background = 'var(--correct)';
                    else if (statuses[i] === 'present' && btn.style.background !== 'var(--correct)') btn.style.background = 'var(--present)';
                    else if (statuses[i] === 'absent' && !['var(--correct)','var(--present)'].includes(btn.style.background)) btn.style.background = 'var(--absent)';
                }
            }

            if (guess === secret) {
                showMsg("🎉 Победа! Ты угадал слово!");
                return;
            }
            currentRow++;
            currentTile = 0;
            if (currentRow === 6) {
                showMsg(`😢 Проигрыш! Было слово: ${secret}`);
            }
        }
    </script>
</body>
</html>
