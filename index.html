<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle RU Pro</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --surface-color: #1a1a24;
            --text-color: #ffffff;
            --absent: #3a3a3c;
            --present: #b59f3b;
            --correct: #538d4e;
            --border: #2a2a38;
            --key-bg: #818384;
            --accent: #6c5ce7;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            box-sizing: border-box;
        }
        .header-left, .header-right {
            display: flex;
            flex-direction: column;
            font-size: 11px;
            color: #a0a0b0;
        }
        .header-title {
            font-size: 16px;
            color: #fff;
            letter-spacing: 2px;
        }
        .controls-bar {
            display: flex;
            gap: 10px;
            padding: 5px;
            align-items: center;
        }
        .btn-small {
            background: var(--accent);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            padding: 10px;
            box-sizing: border-box;
            aspect-ratio: 5 / 6;
            max-height: 34vh;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .tile {
            width: 44px;
            height: 44px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 6px;
            background: var(--surface-color);
            transition: transform 0.5s ease, background-color 0.5s ease, border-color 0.5s ease;
        }
        .tile.filled { border-color: #636e72; transform: scale(1.02); }
        .tile.absent { background-color: var(--absent); border-color: var(--absent); color: white; }
        .tile.present { background-color: var(--present); border-color: var(--present); color: white; }
        .tile.correct { background-color: var(--correct); border-color: var(--correct); color: white; }
        .tile.flip { transform: rotateX(90deg); }

        .keyboard {
            width: 100%;
            max-width: 480px;
            padding: 5px 5px 15px 5px;
            box-sizing: border-box;
        }
        .key-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 5px;
        }
        .key {
            background-color: var(--key-bg);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            height: 44px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-transform: uppercase;
        }
        .key.wide { flex: 1.5; font-size: 10px; }
        
        #message {
            position: fixed;
            top: 65px;
            background: rgba(20, 20, 30, 0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            z-index: 100;
            border: 1px solid var(--accent);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.4);
            font-size: 14px;
        }

        /* Модальное окно */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal-content {
            background: var(--surface-color);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
            width: 80%;
            max-width: 320px;
        }
        .modal-content h2 { margin-top: 0; color: #a29bfe; }
        .modal-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <span class="header-title">WORDLE</span>
            <span id="diffLabel">Сложность: Обычная</span>
        </div>
        <div class="controls-bar">
            <button class="btn-small" id="hintBtn" onclick="giveHint()">💡 Подсказка</button>
            <button class="btn-small" onclick="toggleDifficulty()">⚙️ Режим</button>
        </div>
        <div class="header-right">
            <span>Побед: <b id="winsCount">0</b></span>
            <span>Серия: <b id="streakCount">0</b></span>
        </div>
    </header>
    
    <div id="message">Сообщение</div>
    <div class="board" id="board"></div>
    <div class="keyboard" id="keyboard"></div>

    <!-- Модальное окно при завершении -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="modalTitle">Победа!</h2>
            <p id="modalText">Вы угадали слово!</p>
            <button class="modal-btn" onclick="nextGame()">Играть снова</button>
        </div>
    </div>

    <script>
        // Большая расширенная база русских слов (более 80 слов)
        const WORDS = [
            "КНИГА", "ПИЛОТ", "АТЛАС", "ОКЕАН", "ДЕРЕВО", "ШКОЛА", "УСПЕХ", "НАУКА", "КАТЕР", "ФИЛЬМ", 
            "ГОРОД", "ПОЕЗД", "МАТЕМ", "ЛАГЕР", "ТКАНЬ", "ЗАКОН", "ЗЕМЛЯ", "ЗЕРНО", "ИГРОК", "ИСКРА", 
            "КАНАЛ", "КОВЕР", "ЛЕНТА", "ЛОГИК", "МАСЛО", "МАЯКИ", "МЕТРО", "ОБЛАК", "ОПЕРА", "ПАРТА", 
            "ПЕСНЯ", "ПЛАНШ", "ПОЧТА", "РАБОТ", "РАКЕТ", "РУЧКА", "САЛЮТ", "СЕВЕР", "СКАЛА", "СЛОВО", 
            "СПОРТ", "СХЕМА", "ТАНЕЦ", "ТЕКСТ", "ТРАВА", "ФАКТЫ", "ФРУКТ", "ХОЛСТ", "ЦВЕТЫ", "ЭКРАН", 
            "ЮРИСТ", "АРХИВ", "БАЗИС", "БАТОН", "БУКВА", "ВЕТЕР", "ВИРУС", "ГОЛОС", "ЗАМОК", "ЗАТОР", 
            "ЗЕБРА", "ИСТОК", "КАНАТ", "КАРАТ", "КАССА", "КЛАСС", "КОЛБА", "КОНУС", "КОРОБ", "КОТЕЛ", 
            "ЛАВКА", "ЛАМПА", "МОДЕМ", "МОЛОТ", "НИТКА", "НОСОК", "ПОСОЛ", "РАМКА", "РУБЛЬ", "РЫБКА", 
            "САХАР", "СЕАНС", "СЕТКА", "СИРОП", "СЛИВЫ", "СМОЛА", "СОВЕТ", "СОПЛО", "СТЕНА", "СУМКА", 
            "СУХАР", "СФЕРА", "ТАРИФ", "ТЕСТЬ", "ТИРАЖ", "ТРУБА", "ТУРБО", "ФАКЕЛ", "ФИКУС", "ФИНИШ", 
            "ФОРМА", "ХАКЕР", "ХОББИ", "ХОЛОД", "ЦЕПЬ", "ЦИКЛЫ"
        ];

        // Режимы сложности: "easy" (7 попыток), "normal" (6 попыток), "hard" (5 попыток, без подсказок)
        let currentDifficulty = localStorage.getItem('wordle_diff') || 'normal';
        let maxRows = currentDifficulty === 'easy' ? 7 : (currentDifficulty === 'hard' ? 5 : 6);

        let secret = WORDS[Math.floor(Math.random() * WORDS.length)];
        let currentRow = 0, currentTile = 0, isAnimating = false, gameOver = false;
        const boardState = Array(maxRows).fill("").map(() => Array(5).fill(""));
        const keysState = {};

        let stats = JSON.parse(localStorage.getItem('wordle_stats') || '{"wins":0, "streak":0}');
        updateUIConfig();

        function updateUIConfig() {
            document.getElementById('winsCount').textContent = stats.wins;
            document.getElementById('streakCount').textContent = stats.streak;
            
            let diffName = "Обычная (6)";
            if (currentDifficulty === 'easy') { diffName = "Лёгкая (7)"; document.getElementById('hintBtn').style.display = 'block'; }
            if (currentDifficulty === 'normal') { diffName = "Обычная (6)"; document.getElementById('hintBtn').style.display = 'block'; }
            if (currentDifficulty === 'hard') { diffName = "Хардкор (5)"; document.getElementById('hintBtn').style.display = 'none'; }
            
            document.getElementById('diffLabel').textContent = `Сложность: ${diffName}`;
        }

        function toggleDifficulty() {
            if (currentDifficulty === 'normal') { currentDifficulty = 'hard'; maxRows = 5; }
            else if (currentDifficulty === 'hard') { currentDifficulty = 'easy'; maxRows = 7; }
            else { currentDifficulty = 'normal'; maxRows = 6; }
            
            localStorage.setItem('wordle_diff', currentDifficulty);
            nextGame();
        }

        // Генерация игрового поля под текущую сложность
        const boardEl = document.getElementById('board');
        function buildBoard() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateRows = `repeat(${maxRows}, 1fr)`;
            for (let r = 0; r < maxRows; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';
                for (let c = 0; c < 5; c++) {
                    const tileEl = document.createElement('div');
                    tileEl.className = 'tile';
                    tileEl.id = `tile-${r}-${c}`;
                    rowEl.appendChild(tileEl);
                }
                boardEl.appendChild(rowEl);
            }
        }
        buildBoard();

        const keys = [
            ["Й","Ц","У","К","Е","Н","Г","Ш","Щ","З","Х","Ъ"],
            ["Ф","Ы","В","А","П","Р","О","Л","Д","Ж","Э"],
            ["ENTER","Я","Ч","С","М","И","Т","Ь","Б","Ю","⌫"]
        ];
        
        const keyboardEl = document.getElementById('keyboard');
        keys.forEach(row => {
            const rowEl = document.createElement('div');
            rowEl.className = 'key-row';
            row.forEach(key => {
                const btn = document.createElement('button');
                btn.className = key.length > 1 ? 'key wide' : 'key';
                btn.textContent = key;
                btn.onclick = () => handleKey(key);
                rowEl.appendChild(btn);
                if (key.length === 1) keysState[key] = btn;
            });
            keyboardEl.appendChild(rowEl);
        });

        function handleKey(key) {
            if (isAnimating || gameOver) return;
            if (key === '⌫') {
                if (currentTile > 0) {
                    currentTile--;
                    boardState[currentRow][currentTile] = "";
                    updateTile(currentRow, currentTile, "");
                }
            } else if (key === 'ENTER') {
                if (currentTile === 5) {
                    checkRow();
                } else {
                    showMsg("Введите 5 букв!");
                }
            } else {
                if (currentTile < 5) {
                    boardState[currentRow][currentTile] = key;
                    updateTile(currentRow, currentTile, key);
                    currentTile++;
                }
            }
        }

        function updateTile(r, c, letter) {
            const tile = document.getElementById(`tile-${r}-${c}`);
            tile.textContent = letter;
            tile.className = letter ? 'tile filled' : 'tile';
        }

        function showMsg(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 1600);
        }

        // Функция подсказки: открывает одну случайную букву из секретного слова
        function giveHint() {
            if (currentDifficulty === 'hard') {
                showMsg("❌ В режиме Хардкор нет подсказок!");
                return;
            }
            // Ищем буквы в секрете, которые еще не открыты на клавиатуре или поле
            let unrevealed = [];
            for(let i=0; i<5; i++) {
                let letter = secret[i];
                let btn = keysState[letter];
                if (!btn || btn.style.background !== 'var(--correct)') {
                    unrevealed.push(letter);
                }
            }
            if (unrevealed.length === 0) {
                showMsg("💡 Все буквы уже отгаданы!");
                return;
            }
            let randomLetter = unrevealed[Math.floor(Math.random() * unrevealed.length)];
            showMsg(`💡 Подсказка: буква "${randomLetter}" есть в слове!`);
            if(keysState[randomLetter]) {
                keysState[randomLetter].style.background = '#e1b12c';
            }
        }

        function checkRow() {
            const guess = boardState[currentRow].join("");
            
            if (!WORDS.includes(guess)) {
                showMsg("❌ Эту буквенную комбинацию не знает база!");
                return;
            }

            isAnimating = true;
            const secretChars = secret.split("");
            const guessChars = guess.split("");
            const statuses = Array(5).fill("absent");

            for (let i = 0; i < 5; i++) {
                if (guessChars[i] === secretChars[i]) {
                    statuses[i] = "correct";
                    secretChars[i] = null;
                    guessChars[i] = null;
                }
            }
            for (let i = 0; i < 5; i++) {
                if (guessChars[i] !== null) {
                    const idx = secretChars.indexOf(guessChars[i]);
                    if (idx !== -1) {
                        statuses[i] = "present";
                        secretChars[idx] = null;
                    }
                }
            }

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const tile = document.getElementById(`tile-${currentRow}-${i}`);
                    tile.classList.add('flip');
                    
                    setTimeout(() => {
                        tile.classList.remove('flip');
                        tile.classList.add(statuses[i]);
                        
                        const btn = keysState[guess[i]];
                        if (btn) {
                            if (statuses[i] === 'correct') btn.style.background = 'var(--correct)';
                            else if (statuses[i] === 'present' && btn.style.background !== 'var(--correct)') btn.style.background = 'var(--present)';
                            else if (statuses[i] === 'absent' && !['var(--correct)','var(--present)'].includes(btn.style.background)) btn.style.background = 'var(--absent)';
                        }
                    }, 250);
                }, i * 200);
            }

            setTimeout(() => {
                isAnimating = false;
                if (guess === secret) {
                    gameOver = true;
                    stats.wins++;
                    stats.streak++;
                    localStorage.setItem('wordle_stats', JSON.stringify(stats));
                    showModal("🎉 Победа!", `Вы успешно отгадали слово: ${secret}`);
                    return;
                }

                currentRow++;
                currentTile = 0;
                
                if (currentRow === maxRows) {
                    gameOver = true;
                    stats.streak = 0;
                    localStorage.setItem('wordle_stats', JSON.stringify(stats));
                    showModal("😢 Поражение", `Загаданное слово было: ${secret}`);
                }
            }, 1400);
        }

        function showModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function nextGame() {
            document.getElementById('resultModal').style.display = 'none';
            secret = WORDS[Math.floor(Math.random() * WORDS.length)];
            currentRow = 0;
            currentTile = 0;
            gameOver = false;
            for(let r=0; r<maxRows; r++) {
                for(let c=0; c<5; c++) {
                    boardState[r][c] = "";
                    const tile = document.getElementById(`tile-${r}-${c}`);
                    if(tile) tile.className = 'tile';
                }
            }
            Object.values(keysState).forEach(btn => btn.style.background = 'var(--key-bg)');
            updateUIConfig();
        }
    </script>
</body>
</html>
