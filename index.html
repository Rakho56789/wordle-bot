<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle RU Speed Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1a1a2e 0%, #0d0d12 100%);
            --surface-color: rgba(26, 26, 40, 0.85);
            --text-color: #ffffff;
            --absent: #3a3a3c;
            --present: #b59f3b;
            --correct: #538d4e;
            --border: rgba(255, 255, 255, 0.1);
            --key-bg: #818384;
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.4);
        }
        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 8px 12px;
            font-size: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .header-left, .header-right {
            display: flex;
            flex-direction: column;
            font-size: 10px;
            color: #b0b0c0;
        }
        .header-title {
            font-size: 15px;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .controls-bar {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .btn-small {
            background: var(--accent);
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--accent-glow);
            transition: transform 0.1s;
        }
        .btn-small:active { transform: scale(0.95); }
        
        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            padding: 10px;
            box-sizing: border-box;
            aspect-ratio: 5 / 6;
            max-height: 35vh;
        }
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .tile {
            width: 42px;
            height: 42px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            transition: transform 0.4s ease, background-color 0.4s ease, border-color 0.4s ease;
        }
        .tile.filled { border-color: rgba(255,255,255,0.4); transform: scale(1.02); }
        .tile.absent { background-color: var(--absent); border-color: var(--absent); color: white; }
        .tile.present { background-color: var(--present); border-color: var(--present); color: white; }
        .tile.correct { background-color: var(--correct); border-color: var(--correct); color: white; }
        .tile.flip { transform: rotateX(90deg); }

        .keyboard {
            width: 100%;
            max-width: 450px;
            padding: 5px 4px 15px 4px;
            box-sizing: border-box;
        }
        .key-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 5px;
        }
        .key {
            background-color: rgba(255, 255, 255, 0.12);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            height: 42px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-transform: uppercase;
        }
        .key:active { background-color: rgba(255, 255, 255, 0.3); }
        .key.wide { flex: 1.5; font-size: 10px; }
        
        #message {
            position: fixed;
            top: 60px;
            background: rgba(15, 15, 25, 0.95);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            z-index: 100;
            border: 1px solid var(--accent);
            box-shadow: 0 4px 20px var(--accent-glow);
            font-size: 12px;
        }

        /* Модальные окна */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e1e2f;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid var(--border);
            width: 85%;
            max-width: 310px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-content h2 { margin-top: 0; color: #a29bfe; font-size: 20px; }
        .leaderboard-list {
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
        }
        .leaderboard-list div { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .modal-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
            width: 100%;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <span class="header-title">WORDLE</span>
            <span id="timerDisplay">⏱️ 0.0с</span>
        </div>
        <div class="controls-bar">
            <button class="btn-small" onclick="openLeaderboard()">🏆 Топ</button>
            <button class="btn-small" id="hintBtn" onclick="giveHint()">💡 Подсказка</button>
            <button class="btn-small" onclick="toggleDifficulty()">⚙️ Режим</button>
        </div>
        <div class="header-right">
            <span>Побед: <b id="winsCount">0</b></span>
            <span>Серия: <b id="streakCount">0</b></span>
        </div>
    </header>
    
    <div id="message">Сообщение</div>
    <div class="board" id="board"></div>
    <div class="keyboard" id="keyboard"></div>

    <!-- Модальное окно победы / поражения -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2 id="modalTitle">Победа!</h2>
            <p id="modalText">Время: 0с</p>
            <button class="modal-btn" onclick="nextGame()">Следующая игра</button>
        </div>
    </div>

    <!-- Модальное окно таблицы лидеров (Топ времени) -->
    <div class="modal" id="leaderboardModal">
        <div class="modal-content">
            <h2>🏆 Таблица рекордов</h2>
            <div class="leaderboard-list" id="leaderboardContent">
                <div>1. Еще нет рекордов</div>
            </div>
            <button class="modal-btn" onclick="closeLeaderboard()">Закрыть</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.ready();
        }

        const SECRET_WORDS = [
            "ШАРИК", "ПИРАТ", "КНИГА", "ПИЛОТ", "АТЛАС", "ОКЕАН", "ДЕРЕВО", "ШКОЛА", "УСПЕХ", "НАУКА", 
            "КАТЕР", "ФИЛЬМ", "ГОРОД", "ПОЕЗД", "МАТЕМ", "ЛАГЕР", "ТКАНЬ", "ЗАКОН", "ЗЕМЛЯ", "ЗЕРНО", 
            "ИГРОК", "ИСКРА", "КАНАЛ", "КОВЕР", "ЛЕНТА", "ЛОГИК", "МАСЛО", "МАЯКИ", "МЕТРО", "ОБЛАК",

        ];

        const VALID_WORDS = new Set([...SECRET_WORDS, "ШАРИК", "ПИРАТ", "АВТОР", "АГЕНТ", "АКЦИЯ", "АНГАР", "АРЕНА", "БАКЕН", "БАЛЕТ", "БАНКА", "БАРЖА", "БАСНЯ", "БЕЛКА", "БЕРЕГ", "БИЛЕТ", "БИТВА", "БЛЮДО", "БОКАЛ", "БОЧКА", "БУДКА", "ВАГОН", "ВАННА", "ВЕДРО", "ВЕНЕЦ", "ВЕТКА", "ВИЛКА", "ВИСОК", "ВИТОК", "ВЛАГА", "ВОДКА", "ВОЖАК", "ВОЛНА", "ВОРОТ", "ВУЛКАН", "ГАРАЖ", "ГЕРОЙ", "ГЛИНА", "ГНЕЗД", "ГОРОХ", "ГОСТЬ", "ГРУДЬ", "ДИВАН", "ДОБРО", "ДОЖДЬ", "ДОМЕН", "ДОСКА", "ДРАМА", "ДРОВА", "ДУПЛО", "ДЫМКА", "ЕДИНИ", "ЖАЖДА", "ЖИВОТ", "ЖИРАФ", "ЖУЛИК", "ЗАБОР", "ЗАПАХ", "ЗАПАС", "ЗАХОД", "ЗВЕНО", "ЗЕНИТ", "ЗОЛОТ", "ИДЕАЛ", "ИКОНА", "ИТОГИ", "КАБАН", "КАДРЫ", "КАЗНА", "КАРТА", "КЕПКА", "КИОСК", "КЛЕЩИ", "КЛЮЧИ", "КОВЧЕ", "КОЖАН", "КОЙКА", "КОЛОК", "КОМАР", "КОНЕЦ", "КОПЬЕ", "КОРОН", "КОСТЬ", "КОТЕЛ", "КОФЕЙ", "КРАБЫ", "КРАСК", "КРЕМЛЬ", "КРОВЬ", "КРЫША", "КУБИК", "КУЛАК", "КУПЕЦ", "КУРИЦ", "КУСОК", "КУХНЯ", "ЛАВКА", "ЛАДЬЯ", "ЛАЙКА", "ЛАМПА", "ЛИМОН", "ЛИНИЯ", "ЛОВЕЦ", "ЛОДКА", "ЛОЖКА", "ЛОКОН", "ЛУЧИК", "МАГИЯ", "МАЖОР", "МАЙКА", "МАКЕТ", "МАЛЫШ", "МЕДИК", "МЕЛОЧ", "МЕРКА", "МЕТОД", "МЕШОК", "МИНУС", "МОБИЛ", "МОГИЛ", "МОДЕЛ", "МОНЕТ", "МОСКВ", "МОТИВ", "МОШКА", "МУЖИК", "МУЗЫК", "МЫШКА", "НАБОР", "НАВЕС", "НАЛОГ", "НАРОД", "НАСОС", "НЕДЕЛ", "НЕМЕЦ", "НЕРВЫ", "НОЖИК", "НОМЕР", "НОТКА", "ОБЕДЫ", "ОБРАЗ", "ОБУВЬ", "ОВОЩИ", "ОГОНЬ", "ОКУНЬ", "ОМЛЕТ", "ОПЕРА", "ОРДЕР", "ОСЕНЬ", "ОСТРОВ", "ОТВЕТ", "ОТДЕЛ", "ОХОТА", "ПАРАД", "ПАПКА", "ПАСКА", "ПАУКИ", "ПЕКАР", "ПЕКЛО", "ПЕНАЛ", "ПЕРЕЦ", "ПЕСОК", "ПИКЕТ", "ПИСМО", "ПИТЬЕ", "ПЛАТА", "ПЛЕЧО", "ПЛИТА", "ПЛОТЬ", "ПОБЕД", "ПОГОД", "ПОЖАР", "ПОИСК", "ПОКАЗ", "ПОЛКА", "ПОЛЬЗ", "ПОРОГ", "ПОРТЫ", "ПРАВО", "ПРЕСС", "ПРИНЦ", "ПРОБА", "ПТИЦА", "ПУЛЬС", "ПЯТНО", "РАДИО", "РАЗУМ", "РАМПА", "РЕАКТ", "РЕБРО", "РЕЖИМ", "РЕНТА", "РУПОР", "РЫБАК", "РЫНОК", "РЯДОК", "САЛАТ", "САПОГ", "СВЕКЛ", "СЕВЕР", "СЕМЬЯ", "СЕНАТ", "СЕРДЦ", "СЕСТР", "СИНЯК", "СИРОТ", "СКЛАД", "СКУКА", "СЛАВА", "СЛЕЗА", "СЛОВО", "СЛУХИ", "СМЕНА", "СМЕРТ", "СМОТР", "СОБАЧ", "СОБОР", "СОВЕТ", "СОКОЛ", "СОСЕД", "СОСНА", "СОТНЯ", "СПАЗМ", "СПИРТ", "СПОРТ", "СРОКИ", "СТАДО", "СТЕНД", "СТЕПЬ", "СТИЛЬ", "СТОЛБ", "СТРАХ", "СТУЛЫ", "СУДЬЯ", "СУПЕР", "СУХОЙ", "СХОДЫ", "СЫРЬЕ", "ТАБАК", "ТАБУН", "ТАЙНА", "ТАРИФ", "ТЕКСТ", "ТЕЛЕЦ", "ТЕМПО", "ТЕПЛО", "ТЕСТЫ", "ТИГРЫ", "ТИПИК", "ТКАНЬ", "ТОКАР", "ТОЛПА", "ТОМАТ", "ТОПКА", "ТОПОР", "ТОЧКА", "ТРАВА", "ТРАКТ", "ТРЕСТ", "TРОПА", "ТРУБА", "ТУМАН", "УГРОЗ", "УДАРЫ", "УЖАСЫ", "УКРОП", "УЛИЦА", "УРОКИ", "УТРОМ", "ФАКЕЛ", "ФАКТЫ", "ФИЗИК", "ФИЛЬМ", "ФИНИШ", "ФОКУС", "ФОНДЫ", "ФОРМА", "ФРАЗА", "ФРУКТ", "ХАКЕР", "ХАЛАТ", "ХВОСТ", "ХИМИК", "ХЛЕБЫ", "ХОББИ", "ХОЛОД", "ХРАМЫ", "ЦАРЕВ", "ЦВЕТЫ", "ЦЕЛОЕ", "ЦИКЛЫ", "ЦЫГАН", "ЧАЙКА", "ЧАСИК", "ЧАШКА", "ЧЕРВЬ", "ЧЕРТЫ", "ЧЕХОЛ", "ЧИСЛО", "ЧУДЕС", "ШАЙБА", "ШАПКА", "ШАХТЫ", "ШЕРСТ", "ШКОЛА", "ШПИОН", "ШТАТЫ", "ШТУКА", "ЭКРАН", "ЭЛИТА", "ЭМАЛЬ", "ЭНЕРГ", "ЭТИКА", "ЮРИСТ", "ЯБЛОК", "ЯХТЫ", "ЯЩИКЕ"]);

        let currentDifficulty = localStorage.getItem('wordle_diff') || 'normal';
        let maxRows = currentDifficulty === 'easy' ? 7 : (currentDifficulty === 'hard' ? 5 : 6);
        let secret = SECRET_WORDS[Math.floor(Math.random() * SECRET_WORDS.length)];

        let currentRow = 0, currentTile = 0, isAnimating = false, gameOver = false;
        let startTime = null, timerInterval = null, elapsedTime = 0;
        
        const boardState = Array(maxRows).fill("").map(() => Array(5).fill(""));
        const keysState = {};

        let stats = JSON.parse(localStorage.getItem('wordle_stats') || '{"wins":0, "streak":0}');
        let leaderboard = JSON.parse(localStorage.getItem('wordle_leaderboard') || '[]');
        updateUIConfig();

        function updateUIConfig() {
            document.getElementById('winsCount').textContent = stats.wins;
            document.getElementById('streakCount').textContent = stats.streak;
            
            let diffName = "Обычный";
            if (currentDifficulty === 'easy') { diffName = "Лёгкий"; document.getElementById('hintBtn').style.display = 'block'; }
            if (currentDifficulty === 'normal') { diffName = "Обычный"; document.getElementById('hintBtn').style.display = 'block'; }
            if (currentDifficulty === 'hard') { diffName = "Хардкор"; document.getElementById('hintBtn').style.display = 'none'; }
            
            document.getElementById('diffLabel').textContent = `Режим: ${diffName}`;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('timerDisplay').textContent = `⏱️ ${elapsedTime}с`;
            }, 100);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function toggleDifficulty() {
            if (currentDifficulty === 'normal') { currentDifficulty = 'hard'; maxRows = 5; }
            else if (currentDifficulty === 'hard') { currentDifficulty = 'easy'; maxRows = 7; }
            else { currentDifficulty = 'normal'; maxRows = 6; }
            
            localStorage.setItem('wordle_diff', currentDifficulty);
            nextGame();
        }

        const boardEl = document.getElementById('board');
        function buildBoard() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateRows = `repeat(${maxRows}, 1fr)`;
            for (let r = 0; r < maxRows; r++) {
                const rowEl = document.createElement('div');
                rowEl.className = 'row';
                for (let c = 0; c < 5; c++) {
                    const tileEl = document.createElement('div');
                    tileEl.className = 'tile';
                    tileEl.id = `tile-${r}-${c}`;
                    rowEl.appendChild(tileEl);
                }
                boardEl.appendChild(rowEl);
            }
        }
        buildBoard();

        const keys = [
            ["Й","Ц","У","К","Е","Н","Г","Ш","Щ","З","Х","Ъ"],
            ["Ф","Ы","В","А","П","Р","О","Л","Д","Ж","Э"],
            ["ENTER","Я","Ч","С","М","И","Т","Ь","Б","Ю","⌫"]
        ];
        
        const keyboardEl = document.getElementById('keyboard');
        keys.forEach(row => {
            const rowEl = document.createElement('div');
            rowEl.className = 'key-row';
            row.forEach(key => {
                const btn = document.createElement('button');
                btn.className = key.length > 1 ? 'key wide' : 'key';
                btn.textContent = key;
                btn.onclick = () => handleKey(key);
                rowEl.appendChild(btn);
                if (key.length === 1) keysState[key] = btn;
            });
            keyboardEl.appendChild(rowEl);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') handleKey('⌫');
            else if (e.key === 'Enter') handleKey('ENTER');
            else {
                const key = e.key.toUpperCase();
                if ("ЙЦУКЕНГШЩЗХЪФЫВАПРОЛДЖЭЯЧСМИТЬБЮ".includes(key)) handleKey(key);
            }
        });

        function handleKey(key) {
            if (isAnimating || gameOver) return;
            
            // Запуск таймера при первом вводе буквы
            if (!startTime && key !== 'ENTER' && key !== '⌫') {
                startTimer();
            }

            if (key === '⌫') {
                if (currentTile > 0) {
                    currentTile--;
                    boardState[currentRow][currentTile] = "";
                    updateTile(currentRow, currentTile, "");
                }
            } else if (key === 'ENTER') {
                if (currentTile === 5) {
                    checkRow();
                } else {
                    showMsg("Нужно 5 букв!");
                }
            } else {
                if (currentTile < 5) {
                    boardState[currentRow][currentTile] = key;
                    updateTile(currentRow, currentTile, key);
                    currentTile++;
                }
            }
        }

        function updateTile(r, c, letter) {
            const tile = document.getElementById(`tile-${r}-${c}`);
            tile.textContent = letter;
            tile.className = letter ? 'tile filled' : 'tile';
        }

        function showMsg(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 1500);
        }

        function giveHint() {
            if (currentDifficulty === 'hard') return;
            let unrevealed = [];
            for(let i=0; i<5; i++) {
                let letter = secret[i];
                let btn = keysState[letter];
                if (!btn || btn.style.background !== 'var(--correct)') {
                    unrevealed.push(letter);
                }
            }
            if (unrevealed.length === 0) {
                showMsg("💡 Все буквы открыты!");
                return;
            }
            let randomLetter = unrevealed[Math.floor(Math.random() * unrevealed.length)];
            showMsg(`💡 Подсказка: есть буква "${randomLetter}"`);
            if(keysState[randomLetter]) keysState[randomLetter].style.background = '#e1b12c';
        }

        function checkRow() {
            const guess = boardState[currentRow].join("");
            
            if (!VALID_WORDS.has(guess)) {
                showMsg("❌ Такого слова нет в базе!");
                return;
            }

            isAnimating = true;
            const secretChars = secret.split("");
            const guessChars = guess.split("");
            const statuses = Array(5).fill("absent");

            for (let i = 0; i < 5; i++) {
                if (guessChars[i] === secretChars[i]) {
                    statuses[i] = "correct";
                    secretChars[i] = null;
                    guessChars[i] = null;
                }
            }
            for (let i = 0; i < 5; i++) {
                if (guessChars[i] !== null) {
                    const idx = secretChars.indexOf(guessChars[i]);
                    if (idx !== -1) {
                        statuses[i] = "present";
                        secretChars[idx] = null;
                    }
                }
            }

            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const tile = document.getElementById(`tile-${currentRow}-${i}`);
                    tile.classList.add('flip');
                    
                    setTimeout(() => {
                        tile.classList.remove('flip');
                        tile.classList.add(statuses[i]);
                        
                        const btn = keysState[guess[i]];
                        if (btn) {
                            if (statuses[i] === 'correct') btn.style.background = 'var(--correct)';
                            else if (statuses[i] === 'present' && btn.style.background !== 'var(--correct)') btn.style.background = 'var(--present)';
                            else if (statuses[i] === 'absent' && !['var(--correct)','var(--present)'].includes(btn.style.background)) btn.style.background = 'var(--absent)';
                        }
                    }, 200);
                }, i * 180);
            }

            setTimeout(() => {
                isAnimating = false;
                if (guess === secret) {
                    stopTimer();
                    gameOver = true;
                    stats.wins++;
                    stats.streak++;
                    localStorage.setItem('wordle_stats', JSON.stringify(stats));
                    
                    // Сохраняем в таблицу лидеров
                    saveScore(parseFloat(elapsedTime));
                    
                    showModal("🎉 Победа!", `Слово: ${secret}\nВремя: ${elapsedTime} сек.`);
                    return;
                }

                currentRow++;
                currentTile = 0;
                
                if (currentRow === maxRows) {
                    stopTimer();
                    gameOver = true;
                    stats.streak = 0;
                    localStorage.setItem('wordle_stats', JSON.stringify(stats));
                    showModal("😢 Поражение", `Слово было: ${secret}`);
                }
            }, 1200);
        }

        function saveScore(time) {
            leaderboard.push(time);
            leaderboard.sort((a, b) => a - b); // Сортируем по возрастанию времени (кто быстрее)
            if (leaderboard.length > 5) leaderboard = leaderboard.slice(0, 5); // Оставляем топ-5
            localStorage.setItem('wordle_leaderboard', JSON.stringify(leaderboard));
        }

        function openLeaderboard() {
            const content = document.getElementById('leaderboardContent');
            if (leaderboard.length === 0) {
                content.innerHTML = "<div>Пока нет рекордов. Сыграй партию!</div>";
            } else {
                content.innerHTML = leaderboard.map((t, idx) => `<div>${idx + 1}. <b>${t} сек.</b></div>`).join('');
            }
            document.getElementById('leaderboardModal').style.display = 'flex';
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardModal').style.display = 'none';
        }

        function showModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function nextGame() {
            document.getElementById('resultModal').style.display = 'none';
            secret = SECRET_WORDS[Math.floor(Math.random() * SECRET_WORDS.length)];
            currentRow = 0;
            currentTile = 0;
            gameOver = false;
            startTime = null;
            elapsedTime = 0;
            document.getElementById('timerDisplay').textContent = "⏱️ 0.0с";
            maxRows = currentDifficulty === 'easy' ? 7 : (currentDifficulty === 'hard' ? 5 : 6);
            buildBoard();
            Object.values(keysState).forEach(btn => btn.style.background = 'var(--key-bg)');
            updateUIConfig();
        }
    </script>
</body>
</html>
